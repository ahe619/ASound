plugins {
    id "com.android.application"
}

android {
    namespace "app.asound"
    compileSdk 35

    defaultConfig {
        applicationId "app.asound"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewAssetLoader: serves the bundled app from a secure https origin (needed for the microphone and storage)
    implementation "androidx.webkit:webkit:1.12.1"
}
