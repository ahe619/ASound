name: Check and publish ASound web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check language files
        run: python tools/check_i18n.py
      - name: Check JavaScript
        run: node tools/check_js.mjs
      - name: Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: JavaScript regression tests
        run: node --test tests/*.mjs
      - name: Build a versioned release
        run: python tools/build_web.py
      - name: Upload only the web release
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
  deploy:
    if: github.event_name != 'pull_request' && vars.ASOUND_PAGES_ENABLED == 'true'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
