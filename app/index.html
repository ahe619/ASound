<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASound</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ASound">
<meta name="description" content="Build your English vocabulary and practise real conversations with ASound.">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/interface.css">
<script defer src="js/local-ai.js"></script>
<script defer src="js/voice-input.js"></script>
<!-- modulepreload:start -->
<link rel="modulepreload" href="js/accent.js">
<link rel="modulepreload" href="js/ai.js">
<link rel="modulepreload" href="js/device.js">
<link rel="modulepreload" href="js/diff.js">
<link rel="modulepreload" href="js/drill-bank.js">
<link rel="modulepreload" href="js/engines.js">
<link rel="modulepreload" href="js/i18n.js">
<link rel="modulepreload" href="js/langs.js">
<link rel="modulepreload" href="js/main.js">
<link rel="modulepreload" href="js/me.js">
<link rel="modulepreload" href="js/mic.js">
<link rel="modulepreload" href="js/model-download.js">
<link rel="modulepreload" href="js/models.js">
<link rel="modulepreload" href="js/modes.js">
<link rel="modulepreload" href="js/nav.js">
<link rel="modulepreload" href="js/packs.js">
<link rel="modulepreload" href="js/pitch.js">
<link rel="modulepreload" href="js/prompts.js">
<link rel="modulepreload" href="js/settings.js">
<link rel="modulepreload" href="js/speech-ui.js">
<link rel="modulepreload" href="js/speech.js">
<link rel="modulepreload" href="js/state.js">
<link rel="modulepreload" href="js/store.js">
<link rel="modulepreload" href="js/talk.js">
<link rel="modulepreload" href="js/updates.js">
<link rel="modulepreload" href="js/util.js">
<link rel="modulepreload" href="js/vocab.js">
<link rel="modulepreload" href="js/widgets.js">
<link rel="modulepreload" href="js/word-illustrations.js">
<link rel="modulepreload" href="js/word-relations.js">
<link rel="modulepreload" href="js/word-study-core.js">
<link rel="modulepreload" href="js/word-study.js">
<!-- modulepreload:end -->
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="wrap">
      <div class="brand"><img class="brand-mark" src="img/logo.svg" alt="" width="34" height="34"><span class="brand-name">ASound</span><small class="app-version">V1.01</small></div>
      <nav class="tabs" role="tablist" data-i18n-label="nav.label">
        <button class="tab" role="tab" id="tab-talk" aria-selected="true" data-i18n="tab.talk"></button>
        <button class="tab" role="tab" id="tab-accent" aria-selected="false" data-i18n="tab.accent"></button>
        <button class="tab" role="tab" id="tab-vocab" aria-selected="false"><span data-i18n="tab.vocab"></span><span class="count" id="vocab-count" hidden></span></button>
        <button class="tab" role="tab" id="tab-voices" aria-selected="false" data-i18n="tab.voices"></button>
        <button class="tab" role="tab" id="tab-models" aria-selected="false" data-i18n="tab.models"></button>
        <button class="tab" role="tab" id="tab-me" aria-selected="false" data-i18n="tab.me"></button>
      </nav>
      <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="外观：跟随系统。切换为白天模式" title="外观：跟随系统。切换为白天模式"></button>
      <button class="icon-btn" id="settings-open" type="button" data-i18n-label="settings.open"></button>
    </div>
  </header>

  <main class="view" id="view-talk-home"><div class="wrap stack" id="talk-home"></div></main>

  <main class="view chat" id="view-chat" hidden>
    <div class="chat-head">
      <div class="wrap">
        <span class="chat-title" id="chat-title"></span>
        <span class="level-chip" id="chat-level"></span>
        <span class="spacer"></span>
        <button class="btn" id="live-toggle" type="button"></button>
        <button class="btn" id="end-open" type="button" data-i18n="chat.end"></button>
      </div>
    </div>
    <div class="end-bar" id="end-bar" hidden>
      <div class="wrap">
        <span data-i18n="chat.endAsk"></span>
        <button class="btn primary" id="end-confirm" type="button" data-i18n="chat.endConfirm"></button>
        <button class="btn quiet" id="end-cancel" type="button" data-i18n="chat.endCancel"></button>
      </div>
    </div>
    <div class="thread-scroll" id="thread-scroll">
      <div class="wrap">
        <div class="scene-card" id="scene-card" hidden></div>
        <ol class="thread" id="thread" aria-live="polite"></ol>
      </div>
    </div>
    <form class="composer" id="composer">
      <div class="wrap">
        <div class="hints" id="hints" hidden></div>
        <div class="hints native-box" id="native-box" hidden></div>
        <div class="live-line" id="live-line" hidden></div>
        <div class="composer-row" id="row-voice">
          <button type="button" class="icon-btn hint-btn" data-i18n-label="chat.hint"></button>
          <button type="button" class="icon-btn native-btn" data-i18n-label="chat.native"></button>
          <button type="button" class="icon-btn" id="mode-type" data-i18n-label="chat.toType"></button>
          <p class="composer-note voice-note" data-i18n="chat.voiceNote"></p>
          <span id="voice-mic-slot"></span>
        </div>
        <div class="composer-row" id="row-type" hidden>
          <button type="button" class="icon-btn hint-btn" data-i18n-label="chat.hint"></button>
          <button type="button" class="icon-btn native-btn" data-i18n-label="chat.native"></button>
          <button type="button" class="icon-btn" id="mode-voice" data-i18n-label="chat.toVoice"></button>
          <textarea id="composer-input" rows="1" lang="en" autocomplete="off" spellcheck="false" data-i18n-placeholder="chat.placeholder" data-i18n-label="chat.inputLabel"></textarea>
          <button type="submit" class="btn primary send" id="send-btn" data-i18n-label="chat.send"></button>
        </div>
      </div>
    </form>
  </main>

  <main class="view" id="view-summary" hidden><div class="wrap stack" id="summary"></div></main>
  <main class="view" id="view-accent" hidden><div class="wrap stack" id="accent"></div></main>
  <main class="view" id="view-vocab" hidden><div class="wrap stack-sm" id="vocab"></div></main>
  <main class="view" id="view-me" hidden><div class="wrap stack" id="me"></div></main>
  <main class="view" id="view-mode" hidden><div class="wrap stack" id="mode"></div></main>
  <main class="view" id="view-models" hidden><div class="wrap stack" id="models"></div></main>
  <main class="view" id="view-voices" hidden><div class="wrap stack" id="voices"></div></main>
</div>

<div class="sheet" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
  <div class="sheet-panel" id="settings-panel"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
